[project]
name = "p21gui"
version = "0.1.0"
description = "Cross-platform control panel for the Poly Studio P21"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "hidapi>=0.14",
    "libusb-package>=1.0.26; sys_platform == 'darwin'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pycaw>=20251023; sys_platform == 'win32'",
]

[project.scripts]
p21gui = "p21gui.app:main"

[dependency-groups]
dev = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
